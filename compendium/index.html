<!DOCTYPE html>
<!-- Compendium shell for category browsing, search, and entry details. -->
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Search races, classes, spells, items, features, and more from the D&D compendium.">
    <base href="/">
    <title>Compendium | Cassian's Log</title>
    <script src="shared/js/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="shared/assets/icons/bootstrap-icons.css">
    <link rel="stylesheet" href="shared/assets/tailwind.css">
    <link rel="icon" href="shared/assets/bat.ico">
</head>

<body class="flex min-h-screen flex-col bg-parchment font-sans text-stone-900 antialiased transition-colors dark:bg-ink dark:text-stone-100">
    <nav data-site-header></nav>

    <main class="mx-auto w-full max-w-7xl grow px-4 py-8 sm:px-6 lg:px-8">
        <header class="mb-8">
            <span class="mb-3 inline-flex items-center rounded-full bg-blood-500 px-3 py-1 text-xs font-bold text-white"><i class="bi bi-journals mr-1"></i> Game reference</span>
            <h1 class="font-display text-4xl font-bold sm:text-5xl">Compendium</h1>
            <p class="mt-3 max-w-3xl text-stone-500 dark:text-stone-400">Find rules and gear by name, type, school, damage, rarity, properties, or any keyword.</p>
        </header>

        <section class="mb-6 rounded-2xl border border-stone-300/80 bg-white/75 p-4 shadow-card backdrop-blur-sm dark:border-white/10 dark:bg-white/[.055]" aria-label="Compendium filters">
            <div class="grid grid-cols-1 gap-3 md:grid-cols-12">
                <label class="md:col-span-4">
                    <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Search</span>
                    <div class="relative">
                        <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
                        <input id="compendium-search" type="search" autocomplete="off" class="w-full rounded-xl border border-stone-300 bg-white/80 py-2.5 pl-10 pr-3 text-stone-900 placeholder:text-stone-400 dark:border-white/15 dark:bg-white/5 dark:text-white" placeholder="Longsword, finesse, fire damage…">
                    </div>
                </label>
                <label class="md:col-span-2">
                    <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Category</span>
                    <select id="compendium-category" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-stone-900 dark:text-white">
                        <option value="">All categories</option>
                    </select>
                </label>
                <label class="md:col-span-2">
                    <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Type</span>
                    <select id="compendium-type" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-stone-900 dark:text-white">
                        <option value="">All types</option>
                    </select>
                </label>
                <label class="md:col-span-4">
                    <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Publication</span>
                    <select id="compendium-publication" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-stone-900 dark:text-white">
                        <option value="">All publications</option>
                    </select>
                </label>
            </div>
            <details id="compendium-advanced" class="mt-3 rounded-xl border border-stone-200 bg-stone-50/70 dark:border-white/10 dark:bg-white/[.025]">
                <summary class="flex cursor-pointer list-none items-center justify-between gap-3 px-3 py-2.5 text-sm font-bold text-stone-700 dark:text-stone-200">
                    <span><i class="bi bi-sliders mr-2 text-blood-500"></i>More filters</span>
                    <span id="compendium-advanced-count" class="hidden rounded-full bg-blood-500 px-2 py-0.5 text-xs text-white"></span>
                </summary>
                <div class="grid grid-cols-1 gap-3 border-t border-stone-200 p-3 dark:border-white/10 sm:grid-cols-2 lg:grid-cols-3">
                    <label>
                        <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Kind or group</span>
                        <select id="compendium-kind" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-stone-900 dark:text-white"><option value="">All kinds</option></select>
                    </label>
                    <label>
                        <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Damage type</span>
                        <select id="compendium-damage" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-stone-900 dark:text-white"><option value="">Any damage</option></select>
                    </label>
                    <label>
                        <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Rarity</span>
                        <select id="compendium-rarity" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-stone-900 dark:text-white"><option value="">Any rarity</option></select>
                    </label>
                    <label>
                        <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Attunement</span>
                        <select id="compendium-attunement" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-stone-900 dark:text-white">
                            <option value="">Either</option>
                            <option value="required">Required</option>
                            <option value="not-required">Not required</option>
                        </select>
                    </label>
                    <label>
                        <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Spell level</span>
                        <select id="compendium-level" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-stone-900 dark:text-white"><option value="">Any level</option></select>
                    </label>
                    <label>
                        <span class="mb-1 block text-xs font-bold uppercase tracking-wide text-stone-500 dark:text-stone-400">Spell school</span>
                        <select id="compendium-school" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-stone-900 dark:text-white"><option value="">Any school</option></select>
                    </label>
                </div>
            </details>
            <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
                <p id="compendium-summary" class="text-sm text-stone-500 dark:text-stone-400" aria-live="polite">Loading compendium…</p>
                <button id="compendium-clear" type="button" class="rounded-xl border border-stone-300 px-3 py-2 text-xs font-bold transition hover:border-blood-500 hover:text-blood-500 dark:border-white/15">Clear filters</button>
            </div>
        </section>

        <section aria-labelledby="results-title">
            <h2 id="results-title" class="sr-only">Compendium results</h2>
            <div id="compendium-results" class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3" aria-live="polite">
                <div class="py-16 text-center md:col-span-2 xl:col-span-3">
                    <div class="inline-block h-9 w-9 animate-spin rounded-full border-4 border-blood-500 border-r-transparent" role="status"><span class="sr-only">Loading compendium…</span></div>
                </div>
            </div>
            <div class="mt-6 flex justify-center">
                <button id="compendium-more" type="button" class="hidden rounded-xl border border-blood-500 bg-blood-500 px-5 py-2.5 text-sm font-bold text-white shadow-sm transition hover:bg-blood-600">Show more</button>
            </div>
        </section>
    </main>

    <footer class="mx-auto w-full max-w-7xl px-4 py-5 text-center text-sm text-stone-500 dark:text-stone-400 sm:px-6 lg:px-8">
        Copy an entry to a character, then edit it on the sheet.
    </footer>

    <div id="compendium-detail" class="fixed inset-0 z-50 hidden bg-ink/80 p-3 backdrop-blur-sm sm:p-6" role="dialog" aria-modal="true" aria-labelledby="compendium-detail-title">
        <article class="mx-auto flex h-full max-w-5xl flex-col overflow-hidden rounded-2xl border border-stone-300 bg-parchment shadow-2xl dark:border-white/15 dark:bg-ink">
            <header class="flex items-start justify-between gap-4 border-b border-stone-300 p-4 dark:border-white/10 sm:p-5">
                <div class="min-w-0">
                    <div id="compendium-detail-eyebrow" class="mb-1 text-xs font-bold uppercase tracking-wide text-blood-500"></div>
                    <h2 id="compendium-detail-title" class="font-display text-2xl font-bold sm:text-3xl"></h2>
                    <p id="compendium-detail-source" class="mt-1 text-sm text-stone-500 dark:text-stone-400"></p>
                </div>
                <div class="flex shrink-0 gap-2">
                    <a id="compendium-detail-google" class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-sky-600 text-sky-600 transition hover:bg-sky-600 hover:text-white" target="_blank" rel="noopener noreferrer" aria-label="Search Google"><i class="bi bi-google"></i></a>
                    <button id="compendium-detail-close" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-stone-300 transition hover:border-blood-500 hover:text-blood-500 dark:border-white/15" aria-label="Close details"><i class="bi bi-x-lg"></i></button>
                </div>
            </header>
            <div id="compendium-detail-body" class="grow overflow-y-auto p-4 sm:p-6"></div>
        </article>
    </div>

    <script type="module" src="compendium/js/entry.js"></script>
</body>

</html>
