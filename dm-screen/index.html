<!DOCTYPE html>
<!-- DM Screen shell backed by the shared Screen runtime. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build a private DM Screen from useful reference widgets.">
  <base href="/">
  <title>DM Screen | Cassian's Log</title>
  <script src="shared/js/theme-bootstrap.js"></script>
  <link rel="stylesheet" href="shared/assets/icons/bootstrap-icons.css">
  <link rel="stylesheet" href="shared/assets/tailwind.css">
  <link rel="icon" href="shared/assets/bat.ico">
</head>
<body data-screen-kind="dm" class="flex min-h-screen flex-col bg-parchment font-sans text-stone-900 antialiased dark:bg-ink dark:text-stone-100">
  <nav data-site-header></nav>
  <main class="mx-auto w-full max-w-[96rem] grow px-4 py-8 sm:px-6 lg:px-8">
    <header class="mb-7 flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><span class="inline-flex rounded-full bg-blood-500 px-3 py-1 text-xs font-bold text-white"><i class="bi bi-shield-shaded mr-1.5"></i>Private utility board</span><h1 class="mt-3 font-display text-4xl font-bold sm:text-5xl">DM Screen</h1><p class="mt-2 text-stone-500 dark:text-stone-400">Keep characters, initiative, rules, notes, and tools together.</p></div><button id="screen-refresh" type="button" class="inline-flex items-center justify-center gap-2 rounded-xl border border-blood-500 px-4 py-2.5 text-sm font-bold text-blood-500"><i class="bi bi-arrow-clockwise"></i>Refresh all</button></header>
    <p id="screen-status" class="mb-4 min-h-6 text-sm text-stone-500" role="status" aria-live="polite"></p><section id="screen-grid" class="grid grid-cols-1 items-start gap-5 md:grid-cols-2 xl:grid-cols-3" aria-label="DM Screen widgets"></section>
  </main>
  <div id="screen-editor" class="fixed inset-0 z-50 hidden items-center justify-center bg-ink/85 p-3 backdrop-blur-sm sm:p-6" role="dialog" aria-modal="true" aria-labelledby="screen-editor-title"><form id="screen-editor-form" class="flex h-full w-full max-w-5xl flex-col overflow-hidden rounded-2xl border border-stone-300 bg-parchment shadow-2xl dark:border-white/15 dark:bg-ink"><header class="flex items-start justify-between gap-3 border-b border-stone-300 p-4 dark:border-white/10"><div><p class="text-xs font-bold uppercase tracking-[.16em] text-blood-500">Widget editor</p><h2 id="screen-editor-title" class="font-display text-2xl font-bold">Add widget</h2></div><button type="button" data-close-editor class="h-10 w-10 rounded-xl border border-stone-300 dark:border-white/15" aria-label="Close widget editor"><i class="bi bi-x-lg"></i></button></header><div class="grow overflow-y-auto p-4 sm:p-6"><label class="block"><span class="mb-1 block text-sm font-bold">Widget type</span><select id="screen-widget-type" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 dark:border-white/15 dark:bg-stone-900"></select></label><div id="screen-editor-fields" class="mt-5 space-y-5"></div><p id="screen-editor-error" class="mt-4 hidden rounded-xl border border-danger-500/30 bg-danger-500/10 p-3 text-sm text-danger-500" role="alert"></p></div><footer class="flex justify-end gap-3 border-t border-stone-300 p-4 dark:border-white/10"><button type="button" data-close-editor class="rounded-xl border border-stone-400 px-4 py-2.5 text-sm font-bold">Cancel</button><button type="submit" class="rounded-xl bg-blood-500 px-5 py-2.5 text-sm font-bold text-white">Save widget</button></footer></form></div>
  <div id="screen-detail" class="fixed inset-0 z-[60] hidden items-center justify-center bg-ink/85 p-3 backdrop-blur-sm sm:p-6" role="dialog" aria-modal="true" aria-labelledby="screen-detail-title"><article class="flex h-full w-full max-w-5xl flex-col overflow-hidden rounded-2xl border border-stone-300 bg-parchment shadow-2xl dark:border-white/15 dark:bg-ink"><header class="flex items-start justify-between gap-3 border-b border-stone-300 p-4 dark:border-white/10"><h2 id="screen-detail-title" class="font-display text-2xl font-bold"></h2><button type="button" data-close-detail class="h-10 w-10 rounded-xl border border-stone-300 dark:border-white/15" aria-label="Close expanded widget"><i class="bi bi-x-lg"></i></button></header><div id="screen-detail-body" class="grow overflow-y-auto p-4 sm:p-6"></div></article></div>
  <div id="screen-compendium" class="fixed inset-0 z-[70] hidden items-center justify-center bg-ink/85 p-3 backdrop-blur-sm sm:p-6" role="dialog" aria-modal="true" aria-labelledby="screen-compendium-title"><section class="flex h-full w-full max-w-6xl flex-col overflow-hidden rounded-2xl border border-stone-300 bg-parchment shadow-2xl dark:border-white/15 dark:bg-ink"><header class="flex items-start justify-between gap-3 border-b border-stone-300 p-4 dark:border-white/10"><div><h2 id="screen-compendium-title" class="font-display text-2xl font-bold">Choose from Compendium</h2><p class="text-sm text-stone-500">This creates an independent editable copy.</p></div><button type="button" data-close-compendium class="h-10 w-10 rounded-xl border border-stone-300 dark:border-white/15" aria-label="Close Compendium picker"><i class="bi bi-x-lg"></i></button></header><div class="grid gap-3 border-b border-stone-300 p-4 dark:border-white/10 md:grid-cols-3"><input id="screen-compendium-search" type="search" class="rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 dark:border-white/15 dark:bg-white/5" placeholder="Search Compendium"><select id="screen-compendium-category" class="rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 dark:border-white/15 dark:bg-stone-900"><option value="">All categories</option></select><select id="screen-compendium-publication" class="rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 dark:border-white/15 dark:bg-stone-900"><option value="">All publications</option></select></div><p id="screen-compendium-summary" class="px-4 pt-3 text-sm text-stone-500"></p><div id="screen-compendium-results" class="grid grow content-start gap-4 overflow-y-auto p-4 md:grid-cols-2 xl:grid-cols-3"></div></section></div>
  <div id="screen-image-modal" class="fixed inset-0 z-[90] hidden overflow-auto bg-black/90 p-4 backdrop-blur-sm sm:p-8" role="dialog" aria-modal="true" aria-label="Full-size reference image"><button id="screen-image-close" type="button" class="fixed right-4 top-4 z-[91] h-10 w-10 rounded-full border border-white/25 bg-black/70 text-white" aria-label="Close full-size image"><i class="bi bi-x-lg"></i></button><div class="flex min-h-full min-w-full items-start justify-center"><img id="screen-modal-image" alt="" class="block h-auto max-w-full rounded-lg shadow-2xl"></div></div>
  <script type="module" src="screens/js/entry.js"></script>
</body>
</html>
