<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Choose a character and open their tracker.">
    <title>Cassian's Log — Characters</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="bootstrap/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="bat.ico">
</head>

<body class="bg-body-tertiary min-vh-100 d-flex flex-column">
    <nav class="navbar border-bottom bg-body shadow-sm">
        <div class="container py-2">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="./">
                <i class="bi bi-journal-bookmark-fill text-danger"></i>
                Cassian's Log
            </a>
            <button id="theme-toggle" type="button" class="btn btn-sm btn-outline-secondary"
                aria-label="Switch color theme">
                <i id="theme-icon" class="bi bi-sun-fill"></i>
            </button>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        <header class="mx-auto mb-5 text-center" style="max-width: 42rem;">
            <span class="badge rounded-pill text-bg-danger mb-3">
                <i class="bi bi-dice-20-fill me-1"></i> Character archive
            </span>
            <h1 class="display-5 fw-bold">Choose your character</h1>
            <p class="lead text-body-secondary mb-0">
                Open a character sheet to track hit points, resources, spells, inventory, and notes.
            </p>
        </header>

        <section aria-labelledby="characters-heading">
            <h2 id="characters-heading" class="visually-hidden">Available characters</h2>
            <div id="characters" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 justify-content-center"
                aria-live="polite">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-danger" role="status">
                        <span class="visually-hidden">Loading characters...</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="container py-4 text-center text-body-secondary small">
        Select a character to begin.
    </footer>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        const THEME_KEY = "dnd-theme";

        function applyTheme(theme) {
            const dark = theme === "dark";
            document.documentElement.setAttribute("data-bs-theme", theme);
            document.getElementById("theme-icon").className =
                dark ? "bi bi-sun-fill" : "bi bi-moon-stars-fill";
        }

        function createCharacterCard(character) {
            const column = document.createElement("div");
            column.className = "col";

            const card = document.createElement("article");
            card.className = "card h-100 border-0 shadow-sm overflow-hidden";

            const portrait = document.createElement("img");
            portrait.className = "card-img-top";
            portrait.src = character.portrait || "bat.ico";
            portrait.alt = `${character.name} portrait`;
            portrait.style.aspectRatio = "16 / 10";
            portrait.style.objectFit = "cover";
            portrait.addEventListener("error", () => {
                portrait.src = "bat.ico";
            }, { once: true });

            const body = document.createElement("div");
            body.className = "card-body d-flex flex-column p-4";

            const name = document.createElement("h3");
            name.className = "h4 card-title";
            name.textContent = character.name;

            const description = document.createElement("p");
            description.className = "card-text text-body-secondary flex-grow-1";
            description.textContent = character.description || "Open character tracker.";

            const link = document.createElement("a");
            link.className = "btn btn-danger stretched-link align-self-start";
            link.href = `char/${encodeURIComponent(character.id)}/`;
            link.innerHTML = 'Open tracker <i class="bi bi-arrow-right ms-1"></i>';

            body.append(name, description, link);
            card.append(portrait, body);
            column.append(card);
            return column;
        }

        async function loadCharacters() {
            const container = document.getElementById("characters");
            try {
                const response = await fetch("data/characters.json");
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const characters = await response.json();
                container.replaceChildren(...characters.map(createCharacterCard));
            } catch (error) {
                container.innerHTML =
                    '<div class="col-12"><div class="alert alert-danger">Could not load the character list.</div></div>';
                console.error("Could not load characters:", error);
            }
        }

        const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
        applyTheme(savedTheme);
        document.getElementById("theme-toggle").addEventListener("click", () => {
            const current = document.documentElement.getAttribute("data-bs-theme");
            const next = current === "dark" ? "light" : "dark";
            localStorage.setItem(THEME_KEY, next);
            applyTheme(next);
        });
        loadCharacters();
    </script>
</body>

</html>
