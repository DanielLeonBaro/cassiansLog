<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Choose a character and open their tracker.">
    <title>Cassian's Log — Characters</title>
    <link rel="stylesheet" href="bootstrap/bootstrap-icons.css">
    <link rel="stylesheet" href="dist/tailwind.css">
    <link rel="icon" href="bat.ico">
</head>

<body class="flex min-h-screen flex-col bg-parchment font-sans text-stone-900 antialiased transition-colors dark:bg-ink dark:text-stone-100">
    <nav class="sticky top-0 z-40 border-b border-stone-300/70 bg-parchment/85 shadow-sm backdrop-blur-xl dark:border-white/10 dark:bg-ink/85">
        <div class="relative mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-2 sm:px-6 lg:px-8">
            <a class="flex items-center gap-2 font-display text-lg font-semibold hover:text-blood-500" href="./">
                <i class="bi bi-journal-bookmark-fill text-blood-500"></i>
                Cassian's Log
            </a>
            <button id="theme-toggle" type="button" class="inline-flex items-center justify-center rounded-xl border border-stone-400 bg-white/60 px-3 py-1.5 text-xs font-bold text-stone-700 shadow-sm transition hover:border-blood-500 hover:text-blood-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold dark:border-white/20 dark:bg-white/5 dark:text-stone-200"
                aria-label="Switch color theme">
                <i id="theme-icon" class="bi bi-sun-fill"></i>
            </button>
        </div>
    </nav>

    <main class="relative mx-auto w-full max-w-6xl grow px-4 py-12 sm:px-6 lg:px-8">
        <header class="mx-auto mb-10 max-w-2xl text-center">
            <span class="mb-4 inline-flex items-center rounded-full bg-blood-500 px-3 py-1 text-xs font-bold text-white">
                <i class="bi bi-dice-20-fill mr-1"></i> Character archive
            </span>
            <h1 class="font-display text-4xl font-bold sm:text-5xl">Choose your character</h1>
            <p class="mt-4 text-lg leading-relaxed text-stone-500 dark:text-stone-400">
                Open a character sheet to track hit points, resources, spells, inventory, and notes.
            </p>
            <button id="add-character" type="button" class="mt-6 inline-flex items-center justify-center gap-2 rounded-xl border border-blood-500 bg-blood-500 px-5 py-2.5 text-sm font-bold text-white shadow-sm transition hover:bg-blood-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold">
                <i class="bi bi-person-plus-fill"></i> Create character
            </button>
        </header>

        <section aria-labelledby="characters-heading">
            <h2 id="characters-heading" class="sr-only">Available characters</h2>
            <div id="characters" class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"
                aria-live="polite">
                <div class="py-12 text-center md:col-span-2 xl:col-span-3">
                    <div class="inline-block h-9 w-9 animate-spin rounded-full border-4 border-blood-500 border-r-transparent" role="status">
                        <span class="sr-only">Loading characters...</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="relative mx-auto w-full max-w-6xl px-4 py-4 text-center text-sm text-stone-500 dark:text-stone-400 sm:px-6 lg:px-8">
        Select a character to begin.
    </footer>

    <div id="character-dialog" class="fixed inset-0 z-50 hidden items-center justify-center bg-ink/80 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <form id="character-form" class="w-full max-w-md rounded-2xl border border-stone-300 bg-parchment p-6 shadow-2xl dark:border-white/15 dark:bg-ink">
            <div class="mb-5 flex items-start justify-between gap-3">
                <div>
                    <h2 id="dialog-title" class="font-display text-2xl font-bold">Create a character</h2>
                    <p class="mt-1 text-sm text-stone-500 dark:text-stone-400">Start with the complete blank character template.</p>
                </div>
                <button id="close-dialog" type="button" class="rounded-xl p-2 hover:bg-stone-200 dark:hover:bg-white/10" aria-label="Close"><i class="bi bi-x-lg"></i></button>
            </div>
            <label class="block">
                <span class="mb-1 block text-sm font-bold">Character name</span>
                <input id="new-character-name" required maxlength="80" autocomplete="off" class="w-full rounded-xl border border-stone-300 bg-white/80 px-3 py-2.5 text-stone-900 dark:border-white/15 dark:bg-white/5 dark:text-white" placeholder="New adventurer">
            </label>
            <div class="mt-5 flex justify-end gap-3">
                <button id="cancel-dialog" type="button" class="rounded-xl border border-stone-400 px-4 py-2 text-sm font-bold">Cancel</button>
                <button type="submit" class="inline-flex items-center gap-2 rounded-xl bg-blood-500 px-4 py-2 text-sm font-bold text-white hover:bg-blood-600"><i class="bi bi-arrow-right"></i> Create & edit</button>
            </div>
        </form>
    </div>

    <script>
        const THEME_KEY = "dnd-theme";
        const CHARACTERS_KEY = "dnd-characters";
        const DELETED_KEY = "dnd-deleted-characters";

        function applyTheme(theme) {
            const dark = theme === "dark";
            document.documentElement.setAttribute("data-theme", theme);
            document.getElementById("theme-icon").className =
                dark ? "bi bi-sun-fill" : "bi bi-moon-stars-fill";
        }

        function createCharacterCard(character) {
            const card = document.createElement("article");
            card.className = "group relative flex h-full flex-col overflow-hidden rounded-2xl border border-stone-300/80 bg-white/75 shadow-card backdrop-blur-sm transition hover:-translate-y-1 hover:border-blood-500/40 hover:shadow-xl dark:border-white/10 dark:bg-white/[.055]";

            const portrait = document.createElement("img");
            portrait.className = "aspect-[16/10] w-full object-cover";
            portrait.src = character.portrait || "bat.ico";
            portrait.alt = `${character.name} portrait`;
            portrait.addEventListener("error", () => {
                portrait.src = "bat.ico";
            }, { once: true });

            const body = document.createElement("div");
            body.className = "flex grow flex-col justify-between p-5";

            const text = document.createElement("div");
            text.className = "shrink-0";

            const name = document.createElement("h3");
            name.className = "font-display text-2xl font-bold";
            name.textContent = character.name;

            const description = document.createElement("p");
            description.className = "mt-2 leading-relaxed text-stone-500 dark:text-stone-400";
            description.textContent = character.description || "Open character tracker.";

            const route = character.custom
                ? `char/template/?character=${encodeURIComponent(character.id)}`
                : `char/${encodeURIComponent(character.id)}/`;
            const actions = document.createElement("div");
            actions.className = "relative z-10 flex shrink-0 flex-wrap gap-2 pt-5";

            const link = document.createElement("a");
            link.className = "inline-flex grow items-center justify-center gap-2 rounded-xl border border-blood-500 bg-blood-500 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:border-blood-600 hover:bg-blood-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold";
            link.href = route;
            link.innerHTML = 'Open tracker <i class="bi bi-arrow-right ml-1"></i>';

            const edit = document.createElement("a");
            edit.className = "inline-flex h-10 w-10 items-center justify-center rounded-xl border border-sky-600 text-sky-600 transition hover:bg-sky-600 hover:text-white";
            edit.href = `${route}${route.includes("?") ? "&" : "?"}edit=1`;
            edit.setAttribute("aria-label", `Edit ${character.name}`);
            edit.innerHTML = '<i class="bi bi-pencil-fill"></i>';

            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "inline-flex h-10 w-10 items-center justify-center rounded-xl border border-blood-500 text-blood-500 transition hover:bg-blood-500 hover:text-white";
            remove.setAttribute("aria-label", `Remove ${character.name}`);
            remove.innerHTML = '<i class="bi bi-trash-fill"></i>';
            remove.addEventListener("click", () => removeCharacter(character));

            text.append(name, description);
            actions.append(link, edit, remove);
            body.append(text, actions);
            card.append(portrait, body);
            return card;
        }

        function storedCharacters() {
            try {
                return JSON.parse(localStorage.getItem(CHARACTERS_KEY) || "{}");
            } catch {
                return {};
            }
        }

        function characterDescription(character) {
            const ancestryAndClass = [
                character.race,
                character.class,
                character.subclass,
            ].filter(Boolean).join(" · ");
            return `Level ${character.level ?? "—"} ${ancestryAndClass}`.trim();
        }

        function removeCharacter(character) {
            if (!confirm(`Remove ${character.name}? This only affects this browser.`)) return;
            const stored = storedCharacters();
            delete stored[character.id];
            localStorage.setItem(CHARACTERS_KEY, JSON.stringify(stored));
            if (!character.custom) {
                const deleted = new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || "[]"));
                deleted.add(character.id);
                localStorage.setItem(DELETED_KEY, JSON.stringify([...deleted]));
            }
            loadCharacters();
        }

        async function loadCharacters() {
            const container = document.getElementById("characters");
            try {
                const response = await fetch("data/characters.json");
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const bundled = await response.json();
                const saved = storedCharacters();
                const deleted = new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || "[]"));
                const bundledIds = new Set(bundled.map(character => character.id));
                const characters = bundled
                    .filter(character => !deleted.has(character.id))
                    .map(character => {
                        const override = saved[character.id];
                        return override ? {
                            ...character,
                            name: override.name,
                            portrait: override.portrait,
                            description: characterDescription(override),
                        } : character;
                    });
                Object.values(saved).forEach(character => {
                    if (!bundledIds.has(character.id)) {
                        characters.push({
                            ...character,
                            custom: true,
                            description: characterDescription(character),
                        });
                    }
                });
                container.replaceChildren(...characters.map(createCharacterCard));
            } catch (error) {
                container.innerHTML =
                    '<div class="rounded-2xl border border-blood-500/30 bg-blood-500/10 p-4 text-blood-600 dark:text-red-300 md:col-span-2 xl:col-span-3">Could not load the character list.</div>';
                console.error("Could not load characters:", error);
            }
        }

        const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
        applyTheme(savedTheme);
        document.getElementById("theme-toggle").addEventListener("click", () => {
            const current = document.documentElement.getAttribute("data-theme");
            const next = current === "dark" ? "light" : "dark";
            localStorage.setItem(THEME_KEY, next);
            applyTheme(next);
        });
        const dialog = document.getElementById("character-dialog");
        const nameInput = document.getElementById("new-character-name");
        function openDialog() {
            dialog.classList.remove("hidden");
            dialog.classList.add("flex");
            nameInput.focus();
        }
        function closeDialog() {
            dialog.classList.add("hidden");
            dialog.classList.remove("flex");
            document.getElementById("character-form").reset();
        }
        document.getElementById("add-character").addEventListener("click", openDialog);
        document.getElementById("close-dialog").addEventListener("click", closeDialog);
        document.getElementById("cancel-dialog").addEventListener("click", closeDialog);
        dialog.addEventListener("click", event => {
            if (event.target === dialog) closeDialog();
        });
        document.getElementById("character-form").addEventListener("submit", event => {
            event.preventDefault();
            const name = nameInput.value.trim();
            if (!name) return;
            const base = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "character";
            const occupied = new Set([
                ...Object.keys(storedCharacters()),
                "cassian", "template",
            ]);
            let id = base;
            let suffix = 2;
            while (occupied.has(id)) id = `${base}-${suffix++}`;
            localStorage.setItem("dnd-new-character", JSON.stringify({ id, name }));
            location.href = `char/template/?character=${encodeURIComponent(id)}&new=1&edit=1`;
        });
        loadCharacters();
    </script>
</body>

</html>
