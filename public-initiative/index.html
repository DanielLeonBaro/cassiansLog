<!DOCTYPE html>
<!-- Read-only Public Initiative shell. -->
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="View the current initiative order from Combat & Loot.">
    <base href="../">
    <title>Public Initiative Tracker | Cassian's Log</title>
    <script src="shared/js/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="shared/assets/icons/bootstrap-icons.css">
    <link rel="stylesheet" href="shared/assets/tailwind.css">
    <link rel="icon" href="shared/assets/bat.ico">
</head>

<body class="flex min-h-screen flex-col bg-parchment font-sans text-stone-900 antialiased transition-colors dark:bg-ink dark:text-stone-100">
    <nav data-site-header></nav>

    <main class="mx-auto flex w-full max-w-3xl grow flex-col px-4 py-8 sm:px-6 lg:px-8">
        <header class="mb-8 text-center">
            <span class="mb-3 inline-flex items-center rounded-full bg-blood-500 px-3 py-1 text-xs font-bold text-white"><i class="bi bi-list-ol mr-1"></i> Read-only view</span>
            <h1 class="font-display text-4xl font-bold sm:text-5xl">Public Initiative Tracker</h1>
            <p class="mt-3 text-stone-500 dark:text-stone-400">Refresh this page to load the latest initiative order.</p>
        </header>

        <section class="rounded-2xl border border-stone-300/80 bg-white/60 p-4 shadow-card dark:border-white/10 dark:bg-white/5 sm:p-6" aria-labelledby="initiative-order-title">
            <h2 id="initiative-order-title" class="sr-only">Initiative order</h2>
            <ul id="initiative-list" class="space-y-3" aria-live="polite"></ul>
            <p id="initiative-status" class="py-10 text-center text-stone-500 dark:text-stone-400" role="status">Loading initiative...</p>
        </section>
    </main>

    <script type="module" src="public-initiative/js/entry.js"></script>
</body>

</html>
