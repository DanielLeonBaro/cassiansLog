<!DOCTYPE html>
<!-- Sign-in shell for email/password and Google authentication. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in | Cassian's Log</title>
  <script src="shared/js/theme-bootstrap.js"></script>
  <link rel="stylesheet" href="shared/assets/icons/bootstrap-icons.css">
  <link rel="stylesheet" href="shared/assets/tailwind.css">
  <link rel="icon" href="shared/assets/bat.ico">
</head>
<body class="min-h-screen bg-parchment font-sans text-stone-900 antialiased dark:bg-ink dark:text-stone-100">
  <main class="mx-auto flex min-h-screen w-full max-w-6xl items-center px-4 py-10 sm:px-6 lg:px-8">
    <div class="grid w-full gap-8 lg:grid-cols-[1fr_30rem] lg:items-center">
      <section class="hidden lg:block">
        <p class="text-sm font-bold uppercase tracking-[.2em] text-blood-500">Private campaign archive</p>
        <h1 class="mt-4 max-w-xl font-display text-6xl font-bold leading-tight">Return to Cassian's Log.</h1>
        <p class="mt-5 max-w-lg text-lg leading-relaxed text-stone-500 dark:text-stone-400">Sign in to reach your characters, campaign Wiki, compendium, and table tools.</p>
      </section>

      <section class="rounded-3xl border border-stone-300 bg-white/80 p-6 shadow-2xl backdrop-blur dark:border-white/10 dark:bg-white/[.05] sm:p-8">
        <div class="mb-7 text-center lg:text-left">
          <span class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-blood-500 text-2xl text-white"><i class="bi bi-journal-bookmark-fill"></i></span>
          <h2 id="form-title" class="mt-4 font-display text-3xl font-bold">Sign in</h2>
          <p id="form-description" class="mt-2 text-sm text-stone-500 dark:text-stone-400">Use your account email and password.</p>
        </div>

        <div id="social-actions" class="grid gap-3">
          <a href="api/auth/oauth/google" class="inline-flex items-center justify-center gap-2 rounded-xl border border-stone-300 bg-white px-4 py-3 text-sm font-bold hover:border-blood-500 dark:border-white/15 dark:bg-white/5"><i class="bi bi-google"></i> Google</a>
        </div>

        <div id="divider" class="my-6 flex items-center gap-3 text-xs font-bold uppercase tracking-widest text-stone-400"><span class="h-px grow bg-stone-300 dark:bg-white/10"></span>or<span class="h-px grow bg-stone-300 dark:bg-white/10"></span></div>

        <form id="auth-form" class="space-y-4">
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold">Email</span>
            <input id="email" type="email" required autocomplete="email" class="w-full rounded-xl border border-stone-300 bg-white px-3 py-3 text-stone-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold dark:border-white/15 dark:bg-white/5 dark:text-white" placeholder="you@example.com">
          </label>
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold">Password</span>
            <input id="password" type="password" required minlength="10" autocomplete="current-password" class="w-full rounded-xl border border-stone-300 bg-white px-3 py-3 text-stone-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold dark:border-white/15 dark:bg-white/5 dark:text-white">
            <small id="password-help" class="mt-2 hidden text-stone-500 dark:text-stone-400">At least 10 characters, one number, and one special character.</small>
          </label>
          <p id="auth-status" class="min-h-5 text-sm text-blood-500" role="status" aria-live="polite"></p>
          <button id="submit" type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-blood-500 px-5 py-3 font-bold text-white hover:bg-blood-600 disabled:cursor-wait disabled:opacity-60"><i class="bi bi-box-arrow-in-right"></i><span>Sign in</span></button>
        </form>

        <p id="mode-switch" class="mt-6 text-center text-sm text-stone-500 dark:text-stone-400">New here? <button id="toggle-mode" type="button" class="font-bold text-blood-500 hover:underline">Create an account</button></p>
      </section>
    </div>
  </main>
  <script type="module" src="login/js/entry.js"></script>
</body>
</html>
